name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Syntax check
        run: uv run python -m py_compile syosetu_scraper.py core/fetch.py core/book.py

      - name: Run tests
        run: uv run pytest
